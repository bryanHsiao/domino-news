<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="DRAPI 與 DAS 都有專屬的附件 CRUD 端點，差在定址方式與現代 vs 舊版；DAS 的陷阱是別把內嵌附件資料的整份文件拿去 create/update，會回 400">
  <rect x="0" y="0" width="800" height="430" rx="12" fill="#f7f7f4" stroke="#e2e2dc" stroke-width="1.5"/>

  <text x="400" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">兩套都有專屬的附件端點（CRUD），差在定址與世代</text>

  <!-- Left: DRAPI -->
  <rect x="24" y="52" width="368" height="252" rx="10" fill="#ffffff" stroke="#bcd6d2" stroke-width="1.6"/>
  <text x="208" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">DRAPI（現代 · KEEP）</text>
  <text x="208" y="100" text-anchor="middle" font-size="12.5" fill="#4a4a44">以 {unid}/{name} 定址 + dataSource</text>
  <g font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="44" y="116" width="328" height="30" rx="6" fill="#eaf5ec" stroke="#a9d3ad"/>
    <text x="56" y="136" fill="#256a2e">POST /attachments/{unid}　⬆ 上傳</text>
    <rect x="44" y="152" width="328" height="30" rx="6" fill="#eef2fa" stroke="#a9c0e0"/>
    <text x="56" y="172" fill="#2b4a80">GET /attachments/{unid}/{name}　⬇ 下載</text>
    <rect x="44" y="188" width="328" height="30" rx="6" fill="#fdeeee" stroke="#e6b3b3"/>
    <text x="56" y="208" fill="#8a2b2b">DELETE /attachments/{unid}/{name}　✕ 刪除</text>
  </g>
  <text x="208" y="248" text-anchor="middle" font-size="12" fill="#4a4a44">rich text 走 MIME／multipart</text>
  <text x="208" y="284" text-anchor="middle" font-size="12" fill="#0f766e">積極開發 · Swagger／WOPI／Round Trip</text>

  <!-- Right: DAS -->
  <rect x="408" y="52" width="368" height="252" rx="10" fill="#ffffff" stroke="#d9cdb0" stroke-width="1.6"/>
  <text x="592" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#8a6d1f">DAS（舊版 · Ext. Library）</text>
  <text x="592" y="100" text-anchor="middle" font-size="12.5" fill="#4a4a44">掛在富文本 {itemName} 底下</text>
  <g font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="428" y="116" width="328" height="30" rx="6" fill="#eaf5ec" stroke="#a9d3ad"/>
    <text x="440" y="136" fill="#256a2e">POST …/{docUnid}/{itemName}　⬆ 新增</text>
    <rect x="428" y="152" width="328" height="30" rx="6" fill="#eef2fa" stroke="#a9c0e0"/>
    <text x="440" y="172" fill="#2b4a80">GET …/{itemName}/{fileName}　⬇ 讀取</text>
    <rect x="428" y="188" width="328" height="30" rx="6" fill="#f2eefb" stroke="#c3b3e0"/>
    <text x="440" y="208" fill="#5a3b8a">PUT / DELETE …/{itemName}/{fileName}　更新／刪除</text>
  </g>
  <text x="592" y="248" text-anchor="middle" font-size="12" fill="#4a4a44">GET 文件時 base64 內嵌，或 attachmentlinks</text>
  <text x="592" y="284" text-anchor="middle" font-size="12" fill="#8a6d1f">隨 Extension Library 出貨（v9.0.1）</text>

  <!-- Bottom: the DAS trap -->
  <rect x="24" y="324" width="752" height="82" rx="10" fill="#fff5f5" stroke="#f0c9c9" stroke-width="1.3"/>
  <text x="46" y="352" font-size="14" font-weight="700" fill="#a33">DAS 的陷阱（400 的真相）</text>
  <text x="46" y="378" font-size="13" fill="#7a2b2b">別把「GET 回來、內嵌 base64 附件」的整份文件拿去 create／update → 回 HTTP 400。</text>
  <text x="46" y="398" font-size="13" fill="#7a2b2b">附件要走上面那組專屬端點，不要夾在文件 body 裡回寫——DAS 一樣能上傳。</text>
</svg>
