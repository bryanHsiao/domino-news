<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="欄位公式 DocNo + 反斜線 + FieldCode 算出的值 ABC\File 裡有一個反斜線。放在只是排序的欄位，原樣顯示成字串 ABC\File、不拆層；放在設為分類的欄位，反斜線被當成子分類分隔符，拆成兩層分類：第一層 ABC、第二層 File，文件掛在第二層底下。下一欄若也是分類，正是 KB0102504 的觸發條件。">
  <defs>
    <marker id="aTeal" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#0f766e"/></marker>
    <marker id="aGray" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9a9a90"/></marker>
  </defs>

  <rect x="0" y="0" width="840" height="440" rx="14" fill="#f7f7f4" stroke="#e2e2dc" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1a1a1a">同一個值，放「排序」欄還是「分類」欄，差很多</text>

  <!-- formula -> value -->
  <text x="70" y="64" font-size="10.5" fill="#6b6b63">欄位公式</text>
  <rect x="66" y="70" width="266" height="36" rx="7" fill="#ffffff" stroke="#c9c9c1" stroke-width="1.3"/>
  <text x="199" y="93" text-anchor="middle" font-size="13" fill="#2b2b2b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DocNo + "\\" + FieldCode</text>

  <line x1="340" y1="88" x2="372" y2="88" stroke="#0f766e" stroke-width="2" marker-end="url(#aTeal)"/>

  <text x="382" y="64" font-size="10.5" fill="#6b6b63">算出的值</text>
  <rect x="378" y="70" width="150" height="36" rx="7" fill="#ffffff" stroke="#c9c9c1" stroke-width="1.3"/>
  <text x="453" y="93" text-anchor="middle" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#2b2b2b">ABC</tspan><tspan fill="#c0392b" font-weight="700">\</tspan><tspan fill="#2b2b2b">File</tspan></text>
  <text x="560" y="84" font-size="11.5" font-weight="700" fill="#c0392b">← 這個 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">\</tspan></text>
  <text x="560" y="100" font-size="11.5" font-weight="700" fill="#c0392b">是子分類分隔符</text>

  <!-- split arrows -->
  <line x1="300" y1="128" x2="225" y2="156" stroke="#9a9a90" stroke-width="1.6" marker-end="url(#aGray)"/>
  <line x1="453" y1="128" x2="615" y2="156" stroke="#0f766e" stroke-width="1.8" marker-end="url(#aTeal)"/>

  <!-- LEFT panel: Sorted -->
  <rect x="44" y="160" width="360" height="218" rx="10" fill="#ffffff" stroke="#d8d8d0" stroke-width="1.4"/>
  <rect x="44" y="160" width="360" height="34" rx="10" fill="#f0efe9"/>
  <text x="224" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#6b6b63">放在「排序 (Sorted)」欄</text>
  <!-- mock flat view -->
  <rect x="70" y="214" width="308" height="30" rx="5" fill="#faf9f6" stroke="#e2e2dc"/>
  <text x="86" y="234" font-size="13" fill="#2b2b2b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ABC\File</text>
  <text x="340" y="234" font-size="11" fill="#9a9a90" text-anchor="end">一列</text>
  <text x="70" y="286" font-size="12.5" fill="#2b2b2b">原樣顯示成一個字串，</text>
  <text x="70" y="306" font-size="12.5" font-weight="700" fill="#2b2b2b">不拆層。</text>

  <!-- RIGHT panel: Categorized -->
  <rect x="436" y="160" width="360" height="218" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <rect x="436" y="160" width="360" height="34" rx="10" fill="#eef4f3"/>
  <text x="616" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">放在「分類 (Categorized)」欄</text>
  <!-- mock nested view -->
  <text x="466" y="222" font-size="13.5" font-weight="700" fill="#0f766e">▸ ABC</text>
  <text x="560" y="222" font-size="10.5" fill="#0f766e">← 第 1 層分類</text>
  <path d="M478 230 V 248 H 494" fill="none" stroke="#bcd6d2" stroke-width="1.4"/>
  <text x="500" y="252" font-size="13.5" font-weight="700" fill="#0f766e">▸ File</text>
  <text x="590" y="252" font-size="10.5" fill="#0f766e">← 第 2 層分類</text>
  <path d="M512 260 V 278 H 528" fill="none" stroke="#bcd6d2" stroke-width="1.4"/>
  <text x="534" y="282" font-size="12.5" fill="#8a8a82">📄 文件掛在這層底下</text>
  <text x="466" y="320" font-size="12" fill="#a33">→ 被拆成兩層分類。下一欄要是也分類，</text>
  <text x="466" y="338" font-size="12" font-weight="700" fill="#a33">就正好是 KB0102504 的觸發條件。</text>

  <!-- bottom note -->
  <rect x="44" y="392" width="752" height="34" rx="8" fill="#f0f5f4" stroke="#cfe0dc" stroke-width="1.2"/>
  <text x="60" y="414" font-size="12" fill="#2b2b2b">這條規則 Notes 老手都知道；會中招，是串公式時一時沒把那個 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#c0392b" font-weight="700">\</tspan> 想起來。</text>
</svg>
