<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Both DRAPI and DAS have dedicated attachment CRUD endpoints; they differ in addressing and modern vs legacy. The DAS trap: don't push a whole document with embedded attachment data through create/update, which returns 400.">
  <rect x="0" y="0" width="800" height="430" rx="12" fill="#f7f7f4" stroke="#e2e2dc" stroke-width="1.5"/>

  <text x="400" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Both have dedicated attachment endpoints (CRUD) — differing in addressing and generation</text>

  <!-- Left: DRAPI -->
  <rect x="24" y="52" width="368" height="252" rx="10" fill="#ffffff" stroke="#bcd6d2" stroke-width="1.6"/>
  <text x="208" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">DRAPI (modern · KEEP)</text>
  <text x="208" y="100" text-anchor="middle" font-size="12" fill="#4a4a44">addressed by {unid}/{name} + dataSource</text>
  <g font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="44" y="116" width="328" height="30" rx="6" fill="#eaf5ec" stroke="#a9d3ad"/>
    <text x="56" y="136" fill="#256a2e">POST /attachments/{unid}　⬆ upload</text>
    <rect x="44" y="152" width="328" height="30" rx="6" fill="#eef2fa" stroke="#a9c0e0"/>
    <text x="56" y="172" fill="#2b4a80">GET /attachments/{unid}/{name}　⬇ download</text>
    <rect x="44" y="188" width="328" height="30" rx="6" fill="#fdeeee" stroke="#e6b3b3"/>
    <text x="56" y="208" fill="#8a2b2b">DELETE /attachments/{unid}/{name}　✕ delete</text>
  </g>
  <text x="208" y="248" text-anchor="middle" font-size="12" fill="#4a4a44">rich text as MIME / multipart</text>
  <text x="208" y="284" text-anchor="middle" font-size="11.5" fill="#0f766e">actively developed · Swagger / WOPI / Round Trip</text>

  <!-- Right: DAS -->
  <rect x="408" y="52" width="368" height="252" rx="10" fill="#ffffff" stroke="#d9cdb0" stroke-width="1.6"/>
  <text x="592" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#8a6d1f">DAS (legacy · Ext. Library)</text>
  <text x="592" y="100" text-anchor="middle" font-size="12" fill="#4a4a44">hung off a rich text {itemName}</text>
  <g font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="428" y="116" width="328" height="30" rx="6" fill="#eaf5ec" stroke="#a9d3ad"/>
    <text x="440" y="136" fill="#256a2e">POST …/{docUnid}/{itemName}　⬆ add</text>
    <rect x="428" y="152" width="328" height="30" rx="6" fill="#eef2fa" stroke="#a9c0e0"/>
    <text x="440" y="172" fill="#2b4a80">GET …/{itemName}/{fileName}　⬇ read</text>
    <rect x="428" y="188" width="328" height="30" rx="6" fill="#f2eefb" stroke="#c3b3e0"/>
    <text x="440" y="208" fill="#5a3b8a">PUT / DELETE …/{itemName}/{fileName}　update/delete</text>
  </g>
  <text x="592" y="248" text-anchor="middle" font-size="11.5" fill="#4a4a44">base64 inline on a doc GET, or attachmentlinks</text>
  <text x="592" y="284" text-anchor="middle" font-size="11.5" fill="#8a6d1f">ships with the Extension Library (v9.0.1)</text>

  <!-- Bottom: the DAS trap -->
  <rect x="24" y="324" width="752" height="82" rx="10" fill="#fff5f5" stroke="#f0c9c9" stroke-width="1.3"/>
  <text x="46" y="352" font-size="14" font-weight="700" fill="#a33">The DAS trap (the truth behind the 400)</text>
  <text x="46" y="378" font-size="13" fill="#7a2b2b">Don't push a whole document (GET'd, with base64 attachment data) back through create/update → HTTP 400.</text>
  <text x="46" y="398" font-size="13" fill="#7a2b2b">Use the dedicated endpoints above; don't smuggle attachments through the document body — DAS can upload just fine.</text>
</svg>
