<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="In the JSF lifecycle, phase 4 Update Model Values writes the control values into the data source, which happens before phase 5 Invoke Application (your button SSJS). So when SSJS runs, the bound on-screen values are already in the data source, document1.getDocument() already carries them and (true) is mostly redundant. Exception: immediate=true skips phase 4, so read the control with getComponent().getValue().">
  <defs>
    <marker id="aTeal" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#0f766e"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="400" rx="14" fill="#f7f7f4" stroke="#e2e2dc" stroke-width="1.5"/>
  <text x="480" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">When your button SSJS runs, the on-screen values are already in the data source</text>

  <g>
    <rect x="39" y="78" width="132" height="70" rx="9" fill="#ffffff" stroke="#c9c9c1" stroke-width="1.4"/>
    <text x="105" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a9a90">①</text>
    <text x="105" y="122" text-anchor="middle" font-size="11.5" fill="#6b6b63">Restore</text>
    <text x="105" y="137" text-anchor="middle" font-size="11.5" fill="#6b6b63">View</text>

    <rect x="189" y="78" width="132" height="70" rx="9" fill="#ffffff" stroke="#c9c9c1" stroke-width="1.4"/>
    <text x="255" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a9a90">②</text>
    <text x="255" y="122" text-anchor="middle" font-size="11.5" fill="#6b6b63">Apply Request</text>
    <text x="255" y="137" text-anchor="middle" font-size="11.5" fill="#6b6b63">Values</text>

    <rect x="339" y="78" width="132" height="70" rx="9" fill="#ffffff" stroke="#c9c9c1" stroke-width="1.4"/>
    <text x="405" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a9a90">③</text>
    <text x="405" y="122" text-anchor="middle" font-size="11.5" fill="#6b6b63">Process</text>
    <text x="405" y="137" text-anchor="middle" font-size="11.5" fill="#6b6b63">Validations</text>

    <rect x="489" y="78" width="132" height="70" rx="9" fill="#eef4f3" stroke="#0f766e" stroke-width="1.8"/>
    <text x="555" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e">④</text>
    <text x="555" y="122" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">Update Model</text>
    <text x="555" y="137" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">Values</text>

    <rect x="639" y="78" width="132" height="70" rx="9" fill="#eef4f3" stroke="#0f766e" stroke-width="1.8"/>
    <text x="705" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e">⑤</text>
    <text x="705" y="122" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">Invoke</text>
    <text x="705" y="137" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">Application</text>

    <rect x="789" y="78" width="132" height="70" rx="9" fill="#ffffff" stroke="#c9c9c1" stroke-width="1.4"/>
    <text x="855" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a9a90">⑥</text>
    <text x="855" y="122" text-anchor="middle" font-size="11.5" fill="#6b6b63">Render</text>
    <text x="855" y="137" text-anchor="middle" font-size="11.5" fill="#6b6b63">Response</text>
  </g>

  <g stroke="#0f766e" stroke-width="2" fill="none">
    <path d="M171 113 H187" marker-end="url(#aTeal)"/>
    <path d="M321 113 H337" marker-end="url(#aTeal)"/>
    <path d="M471 113 H487" marker-end="url(#aTeal)"/>
    <path d="M621 113 H637" marker-end="url(#aTeal)"/>
    <path d="M771 113 H787" marker-end="url(#aTeal)"/>
  </g>

  <line x1="555" y1="186" x2="555" y2="150" stroke="#0f766e" stroke-width="1.5" marker-end="url(#aTeal)"/>
  <text x="555" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">control values → data source</text>
  <line x1="705" y1="186" x2="705" y2="150" stroke="#0f766e" stroke-width="1.5" marker-end="url(#aTeal)"/>
  <text x="705" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">your button SSJS runs here</text>

  <text x="630" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">④ before ⑤ → so when SSJS runs, the values are already in the data source</text>

  <rect x="24" y="246" width="912" height="134" rx="10" fill="#f0f5f4" stroke="#cfe0dc" stroke-width="1.3"/>
  <text x="44" y="274" font-size="13" fill="#2b2b2b">In a normal submit, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">document1.getDocument()</tspan> already carries the on-screen values —</text>
  <text x="44" y="299" font-size="13" font-weight="700" fill="#0f766e">adding <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(true)</tspan> just to "grab the on-screen values" is mostly redundant.</text>
  <text x="44" y="331" font-size="12" fill="#a33">Exception: an <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">immediate="true"</tspan> event skips phase ④ → the values never reach the data source,</text>
  <text x="44" y="353" font-size="12" fill="#a33">so read the control directly with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">getComponent("xx").getValue()</tspan>.</text>
</svg>
