<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="多選的檔案全部落進文件同一個富文本欄位，成為多個 $FILE 附件；刪除時可迭代 EmbeddedObjects 依條件挑著刪，或用 RemoveItem 一次全清">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#f7f7f4" stroke="#e2e2dc" stroke-width="1.5"/>

  <!-- Left: file picker with multiple selection -->
  <text x="150" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">瀏覽器選檔（multiple）</text>
  <rect x="40" y="60" width="220" height="150" rx="8" fill="#ffffff" stroke="#c9c9c1" stroke-width="1.5"/>
  <g font-size="14" fill="#2b2b2b">
    <rect x="58" y="78" width="184" height="30" rx="5" fill="#eef4f3" stroke="#bcd6d2"/>
    <text x="70" y="98">📄 report.pdf</text>
    <rect x="58" y="116" width="184" height="30" rx="5" fill="#eef4f3" stroke="#bcd6d2"/>
    <text x="70" y="136">🖼 chart.png</text>
    <rect x="58" y="154" width="184" height="30" rx="5" fill="#eef4f3" stroke="#bcd6d2"/>
    <text x="70" y="174">📎 spec.docx</text>
  </g>
  <text x="150" y="200" text-anchor="middle" font-size="12" fill="#6b6b63">一次選多個</text>

  <!-- Arrow -->
  <g stroke="#0f766e" stroke-width="2.5" fill="none">
    <path d="M270 135 H330" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Right: document + Body rich text field holding $FILE items -->
  <text x="565" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">同一份文件 · Body 富文本欄位</text>
  <rect x="350" y="60" width="430" height="205" rx="8" fill="#ffffff" stroke="#c9c9c1" stroke-width="1.5"/>
  <text x="372" y="86" font-size="13" font-weight="600" fill="#0f766e">NotesDocument</text>
  <rect x="372" y="98" width="386" height="150" rx="6" fill="#faf8f2" stroke="#e4d9b8" stroke-width="1.3"/>
  <text x="388" y="120" font-size="13" fill="#7a6a2f">Body（rich text）</text>
  <g font-size="13.5" fill="#2b2b2b">
    <rect x="388" y="132" width="354" height="30" rx="5" fill="#f0efe9" stroke="#d8d8cf"/>
    <text x="402" y="152">$FILE · report.pdf</text>
    <rect x="388" y="168" width="354" height="30" rx="5" fill="#f0efe9" stroke="#d8d8cf"/>
    <text x="402" y="188">$FILE · chart.png</text>
    <rect x="388" y="204" width="354" height="30" rx="5" fill="#f0efe9" stroke="#d8d8cf"/>
    <text x="402" y="224">$FILE · spec.docx</text>
  </g>

  <!-- Delete callout: selective first (common), clear-all second -->
  <rect x="40" y="290" width="720" height="88" rx="8" fill="#fff5f5" stroke="#f0c9c9" stroke-width="1.3"/>
  <text x="62" y="314" font-size="14" font-weight="700" fill="#a33">刪除</text>
  <text x="112" y="314" font-size="12.5" fill="#a33">實務上多是「挑著刪」</text>
  <text x="62" y="340" font-size="13" fill="#7a2b2b">依條件挑著刪（最常見）：迭代 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">EmbeddedObjects</tspan>、依 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.Source</tspan> 條件逐一 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Remove</tspan></text>
  <text x="62" y="364" font-size="13" fill="#7a2b2b">要一次全清才用：<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Call doc.RemoveItem("$FILE")</tspan></text>
</svg>
