<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Three steps: after save, the in-memory tmpdoc and the note on disk both hold the old value; after runOnServer the agent writes the new value to disk, but the in-memory tmpdoc is still the old value (stale); recycle() the stale object then getDocumentByID re-fetches, and only then does memory hold the new value.">
  <defs>
    <marker id="aTeal" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#0f766e"/></marker>
    <marker id="aGreen" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#15803d"/></marker>
    <marker id="aGray" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#a8a89e"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" rx="14" fill="#f7f7f4" stroke="#e2e2dc" stroke-width="1.5"/>
  <text x="450" y="37" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1a1a1a">After runOnServer, tmpdoc is stale — recycle + getDocumentByID re-fetch to sync</text>

  <!-- lane gutter labels -->
  <text x="22" y="128" font-size="12.5" font-weight="700" fill="#0f766e">Memory</text>
  <text x="22" y="144" font-size="10" fill="#6b6b63">tmpdoc object</text>
  <text x="22" y="320" font-size="12.5" font-weight="700" fill="#0f766e">Disk</text>
  <text x="22" y="336" font-size="10" fill="#6b6b63">the real note</text>

  <!-- step headers -->
  <text x="250" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#444">① After save</text>
  <text x="500" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#444">② After runOnServer</text>
  <text x="750" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#444">③ recycle + re-fetch</text>

  <!-- connector lines across columns -->
  <line x1="338" y1="133" x2="408" y2="133" stroke="#a8a89e" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#aGray)"/>
  <line x1="588" y1="133" x2="658" y2="133" stroke="#15803d" stroke-width="2.2" marker-end="url(#aGreen)"/>
  <line x1="338" y1="325" x2="408" y2="325" stroke="#0f766e" stroke-width="2.2" marker-end="url(#aTeal)"/>
  <line x1="588" y1="325" x2="658" y2="325" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#aTeal)"/>

  <!-- memory chips (y 108..158) -->
  <rect x="162" y="108" width="176" height="50" rx="8" fill="#ffffff" stroke="#c9c9c1" stroke-width="1.4"/>
  <text x="250" y="139" text-anchor="middle" font-size="14" fill="#2b2b2b">field = old value</text>

  <rect x="412" y="108" width="176" height="50" rx="8" fill="#fff5f5" stroke="#f0c9c9" stroke-width="1.4"/>
  <text x="500" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#a33">field = old value　❌</text>
  <text x="500" y="149" text-anchor="middle" font-size="9.5" fill="#a33">stale · won't self-update</text>

  <rect x="662" y="108" width="176" height="50" rx="8" fill="#eef7f0" stroke="#9ecbab" stroke-width="1.4"/>
  <text x="750" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">field = new value　✅</text>

  <!-- disk chips (y 300..350) -->
  <rect x="162" y="300" width="176" height="50" rx="8" fill="#ffffff" stroke="#c9c9c1" stroke-width="1.4"/>
  <text x="250" y="331" text-anchor="middle" font-size="14" fill="#2b2b2b">note = old value</text>

  <rect x="412" y="300" width="176" height="50" rx="8" fill="#eef4f3" stroke="#bcd6d2" stroke-width="1.4"/>
  <text x="500" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">note = new value</text>

  <rect x="662" y="300" width="176" height="50" rx="8" fill="#eef4f3" stroke="#bcd6d2" stroke-width="1.4"/>
  <text x="750" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">note = new value</text>

  <!-- action tag 1 (gap1, affects disk) -->
  <line x1="375" y1="248" x2="375" y2="296" stroke="#0f766e" stroke-width="1.6" marker-end="url(#aTeal)"/>
  <rect x="300" y="200" width="150" height="46" rx="8" fill="#eef4f3" stroke="#bcd6d2" stroke-width="1.3"/>
  <text x="375" y="220" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">runOnServer</text>
  <text x="375" y="236" text-anchor="middle" font-size="10" fill="#0f766e">agent writes disk → new</text>

  <!-- action tag 2 (gap2, affects memory) -->
  <line x1="625" y1="200" x2="625" y2="160" stroke="#15803d" stroke-width="1.6" marker-end="url(#aGreen)"/>
  <rect x="545" y="200" width="160" height="46" rx="8" fill="#eef7f0" stroke="#9ecbab" stroke-width="1.3"/>
  <text x="625" y="220" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">recycle() +</text>
  <text x="625" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">getDocumentByID</tspan> re-fetch</text>

  <!-- summary box -->
  <rect x="24" y="372" width="852" height="68" rx="10" fill="#f0f5f4" stroke="#cfe0dc" stroke-width="1.3"/>
  <text x="44" y="399" font-size="13" font-weight="700" fill="#1a1a1a">Key: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400">tmpdoc</tspan> is a snapshot from load time; the agent's on-disk change doesn't sync back.</text>
  <text x="44" y="423" font-size="12.5" fill="#444">So <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">recycle()</tspan> the stale object, then <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">getDocumentByID(noteid)</tspan> to reload from disk and read the new values.</text>
</svg>
