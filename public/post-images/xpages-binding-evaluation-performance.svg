<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="一次提交跑整輪 JSF 六階段。#{}（compute dynamically）的 value binding 在多個階段被讀就被重算，一次提交加起來好幾遍。${}（compute on page load）只在頁面載入時算一次、烤成靜態值，之後整輪都不再算。rendered=false 的控制項還在 component tree、各階段仍被處理；loaded=false 根本不建進 tree、全程跳過，getComponent 也抓不到。">
  <defs>
    <marker id="aGray" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#b8b8ae"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="430" rx="14" fill="#f7f7f4" stroke="#e2e2dc" stroke-width="1.5"/>
  <text x="480" y="34" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1a1a1a">為什麼一次提交你的 computed 被算了好幾遍</text>

  <!-- 6 phase boxes (context, neutral) y=52 h=52 -->
  <g>
    <rect x="39" y="52" width="132" height="52" rx="8" fill="#ffffff" stroke="#d8d8d0" stroke-width="1.2"/>
    <text x="105" y="73" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a9a90">①</text>
    <text x="105" y="92" text-anchor="middle" font-size="10" fill="#8a8a82">Restore View</text>
    <rect x="189" y="52" width="132" height="52" rx="8" fill="#ffffff" stroke="#d8d8d0" stroke-width="1.2"/>
    <text x="255" y="73" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a9a90">②</text>
    <text x="255" y="92" text-anchor="middle" font-size="10" fill="#8a8a82">Apply Req. Values</text>
    <rect x="339" y="52" width="132" height="52" rx="8" fill="#ffffff" stroke="#d8d8d0" stroke-width="1.2"/>
    <text x="405" y="73" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a9a90">③</text>
    <text x="405" y="92" text-anchor="middle" font-size="10" fill="#8a8a82">Process Validations</text>
    <rect x="489" y="52" width="132" height="52" rx="8" fill="#ffffff" stroke="#d8d8d0" stroke-width="1.2"/>
    <text x="555" y="73" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a9a90">④</text>
    <text x="555" y="92" text-anchor="middle" font-size="10" fill="#8a8a82">Update Model Values</text>
    <rect x="639" y="52" width="132" height="52" rx="8" fill="#ffffff" stroke="#d8d8d0" stroke-width="1.2"/>
    <text x="705" y="73" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a9a90">⑤</text>
    <text x="705" y="92" text-anchor="middle" font-size="10" fill="#8a8a82">Invoke Application</text>
    <rect x="789" y="52" width="132" height="52" rx="8" fill="#ffffff" stroke="#d8d8d0" stroke-width="1.2"/>
    <text x="855" y="73" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a9a90">⑥</text>
    <text x="855" y="92" text-anchor="middle" font-size="10" fill="#8a8a82">Render Response</text>
  </g>
  <g stroke="#b8b8ae" stroke-width="1.6" fill="none">
    <path d="M171 78 H187" marker-end="url(#aGray)"/><path d="M321 78 H337" marker-end="url(#aGray)"/>
    <path d="M471 78 H487" marker-end="url(#aGray)"/><path d="M621 78 H637" marker-end="url(#aGray)"/>
    <path d="M771 78 H787" marker-end="url(#aGray)"/>
  </g>

  <!-- #{} row: re-evaluated at multiple phases -->
  <text x="24" y="150" font-size="15" font-weight="700" fill="#c0392b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">#{}</text>
  <text x="24" y="166" font-size="9.5" fill="#6b6b63">compute dynamically</text>
  <line x1="150" y1="150" x2="760" y2="150" stroke="#eccaca" stroke-width="1.4" stroke-dasharray="3 3"/>
  <g fill="#c0392b">
    <circle cx="255" cy="150" r="6"/><circle cx="405" cy="150" r="6"/><circle cx="555" cy="150" r="6"/><circle cx="705" cy="150" r="6"/>
  </g>
  <g fill="#c0392b" font-size="9.5" text-anchor="middle">
    <text x="255" y="137">算</text><text x="405" y="137">算</text><text x="555" y="137">算</text><text x="705" y="137">算</text>
  </g>
  <text x="790" y="154" font-size="11.5" font-weight="700" fill="#c0392b">= 一次提交好幾遍</text>
  <text x="150" y="186" font-size="11.5" fill="#a33">每次那個值被讀取／render 都重算——跨這些階段加起來，就是一次點擊算了好幾遍。</text>

  <!-- ${} row: evaluated once at load -->
  <text x="24" y="226" font-size="15" font-weight="700" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">${}</text>
  <text x="24" y="242" font-size="9.5" fill="#6b6b63">compute on page load</text>
  <circle cx="150" cy="226" r="6" fill="#15803d"/>
  <text x="150" y="213" font-size="9.5" fill="#15803d" text-anchor="middle">載入算一次</text>
  <line x1="162" y1="226" x2="760" y2="226" stroke="#15803d" stroke-width="1.6"/>
  <text x="790" y="230" font-size="11.5" font-weight="700" fill="#15803d">= 之後都是靜態值</text>
  <text x="170" y="262" font-size="11.5" fill="#2b2b2b">頁面載入時算一次、烤成靜態值，之後整輪生命週期都不再算（值在這次請求不會變的，就用它）。</text>

  <!-- bottom box: rendered vs loaded -->
  <rect x="24" y="282" width="912" height="132" rx="10" fill="#f0f5f4" stroke="#cfe0dc" stroke-width="1.3"/>
  <text x="44" y="308" font-size="13.5" font-weight="700" fill="#1a1a1a"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rendered</tspan> vs <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">loaded</tspan>：在不在 component tree 裡</text>
  <text x="44" y="333" font-size="12.5" fill="#2b2b2b"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">rendered="false"</tspan>：控制項還是建進 tree、只是不顯示 → 生命週期各階段仍會處理、評估、載資源。</text>
  <text x="44" y="357" font-size="12.5" fill="#2b2b2b"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">loaded="false"</tspan>：根本不建進 tree → 全程跳過、不評估、<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">getComponent</tspan> 也抓不到 → 更省。</text>
  <text x="44" y="387" font-size="12" font-weight="700" fill="#0f766e">可見性在這次請求裡固定 → 用 loaded；要留在 tree 等 partial refresh／程式抓取 → 用 rendered。</text>
</svg>
