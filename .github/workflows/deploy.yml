name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 這些路徑不會進 dist（staging 中的文章、退稿、coverage 報表、文件），
    # 只動到它們的 commit 不必重新部署 — 每次部署會產生 ~數十 MB 的 Pages
    # artifact，算進 Actions storage 配額。
    # 注意 data/、research/、scripts/ 都會被 build 讀到，不能列進來。
    paths-ignore:
      - '_pending/**'
      - '_drafts/**'
      - 'docs/**'
      - '.claude/**'
      - 'README.md'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
