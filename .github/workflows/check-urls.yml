name: Check Post URLs

on:
  push:
    # 只有動到文章或檢查腳本才跑 — 避免封面/coverage/部署 commit 也去打 ~289 個外部 URL
    paths:
      - 'src/content/posts/**'
      - 'scripts/check-post-urls.ts'
      - 'scripts/lib/verify-urls.ts'
  schedule:
    # 每週日 23:00 UTC (台灣週一 07:00) — 跟 daily-article 同時段，但沒衝突
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit every URL in every published post
        run: npm run check:urls
